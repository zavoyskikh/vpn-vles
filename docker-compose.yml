services:
  3xui:
    image: ghcr.io/mhsanaei/3x-ui:v3.6.0
    container_name: 3xui_app
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - $PWD/db/:/etc/x-ui/
      - $PWD/cert/:/root/cert/
      - $PWD/acme/:/root/.acme.sh/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      XUI_DB_TYPE: "postgres"
      XUI_DB_DSN: "postgres://xui:xui@postgres:5432/xui?sslmode=disable"
    tty: true
    ports:
      - "443:443/udp"
    networks:
      - 3xui-network
    restart: unless-stopped
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: 3xui_postgres
    environment:
      POSTGRES_USER: xui
      POSTGRES_PASSWORD: xui
      POSTGRES_DB: xui
    volumes:
      - $PWD/pgdata/:/var/lib/postgresql/data
    networks:
      - 3xui-network
    restart: unless-stopped

  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: 3xui_npm
    restart: unless-stopped
    ports:
      - '80:80'
      - '4443:443'
      - '81:81'
    volumes:
      - $PWD/npm/data:/data
      - $PWD/npm/letsencrypt:/etc/letsencrypt
    networks:
      - 3xui-network

networks:
  3xui-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
