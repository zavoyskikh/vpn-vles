services:
  3xui:
    image: ghcr.io/mhsanaei/3x-ui:v3.6.0
    container_name: 3xui_app
    # hostname: yourhostname <- optional
    # The bundled Fail2ban (XUI_ENABLE_FAIL2BAN below) enforces the IP limit
    # with iptables, which needs NET_ADMIN. Without these caps a ban is logged
    # and shown in fail2ban status but never actually applied. NET_RAW covers
    # ip6tables. If you disable Fail2ban, you can drop cap_add.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - $PWD/db/:/etc/x-ui/
      - $PWD/cert/:/root/cert/
      # Persists acme.sh state so certificate auto-renewal survives container
      # recreation (the entrypoint re-registers the renewal cron job from it).
      - $PWD/acme/:/root/.acme.sh/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      # To use PostgreSQL instead of the default SQLite, run:
      #   docker compose --profile postgres up -d
      # and uncomment the two lines below.
      XUI_DB_TYPE: "postgres"
      XUI_DB_DSN: "postgres://xui:xui@postgres:5432/xui?sslmode=disable"
    tty: true
    ports:
      - "443:443"
#      - "2053:2053"
    networks:
      - 3xui-network
    restart: unless-stopped
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: 3xui_postgres
#    profiles: ["postgres"]
    environment:
      POSTGRES_USER: xui
      POSTGRES_PASSWORD: xui
      POSTGRES_DB: xui
    volumes:
      - $PWD/pgdata/:/var/lib/postgresql/data
    networks:
      - 3xui-network
    restart: unless-stopped

  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: 3xui_npm
    restart: unless-stopped
    ports:
      - '80:80'   # HTTP трафик для Let's Encrypt и редиректов
      - '4443:443' # HTTPS основной зашифрованный трафик
      - '81:81'   # Порт для входа в админ-панель самого Proxy Manager
#    environment:
#      - HTTP_PORT=80       # Внутренний порт для HTTP (по умолчанию 80)
#      - HTTPS_PORT=4443    # МЕНЯЕМ ВНУТРЕННИЙ ПОРТ HTTPS НА 4443
    volumes:
      - $PWD/npm/data:/data
      - $PWD/npm/letsencrypt:/etc/letsencrypt
    networks:
      - 3xui-network

networks:
  3xui-network:
    driver: bridge
